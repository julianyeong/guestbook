# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-88

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crljy88.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2119E9CFB5224A29A1F7890F0D3946F7 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_1D2E10576AEF4BF79FC27B422A67A3FA }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crljy88.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2119E9CFB5224A29A1F7890F0D3946F7 }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-88'
          slot-name: 'staging'
          images: 'crljy88.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2119E9CFB5224A29A1F7890F0D3946F7 }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D192A67A79FB47969FB42685E1364BED }}